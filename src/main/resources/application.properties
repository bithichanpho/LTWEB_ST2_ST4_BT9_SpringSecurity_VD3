spring.config.import=optional:file:.env[.properties]

spring.application.name=SpringBootSecurityVD3
server.port=${SERVER_PORT:8080}

# ============================================================
# DATABASE (SQL Server)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SpringBootSecurityVD3;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true
# data.sql chay SAU khi Hibernate tao/cap nhat bang (tao san 2 role)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============================================================
# PHUC VU FILE TINH + ANH UPLOAD
# - classpath:/static/ : giao dien (assets) + anh co san trong project
# - file:$app.upload.dir/ : anh upload local (fallback khi chua co Cloudinary)
# ============================================================
spring.web.resources.static-locations=classpath:/static/,file:${user.home}/shopapp-uploads/

# ============================================================
# MAIL (OTP qua Gmail SMTP) - dien MAIL_USERNAME/MAIL_PASSWORD trong .env
# Neu de trong, OTP se duoc in ra console (che do dev) de demo.
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# CLOUDINARY - dien 3 gia tri trong .env de upload anh len cloud.
# Neu de trong, anh upload se duoc luu vao app.upload.dir (fallback).
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Thu muc luu anh upload (fallback + anh danh muc)
app.upload.dir=${user.home}/shopapp-uploads

# ============================================================
# MULTIPART / UTF-8
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.force-request=true
spring.servlet.encoding.force-response=true
server.tomcat.uri-encoding=UTF-8
spring.main.allow-bean-definition-overriding=true
