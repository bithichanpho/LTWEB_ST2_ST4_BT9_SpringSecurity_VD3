<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co loi xay ra - SHOP</title>
<link rel="icon" type="image/png" th:href="@{/assets/images/favicon.ico}">
<link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/main.css}">
</head>
<body>

	<div class="login-wrapper">
		<div class="login-bg-shape login-bg-shape-1"></div>
		<div class="login-bg-shape login-bg-shape-2"></div>

		<div class="login-card text-center">
			<a th:href="@{/home}" class="login-brand text-decoration-none"> <i
				class="bi bi-bag-heart-fill"></i> <span>SHOP</span>
			</a>

			<i class="bi bi-exclamation-triangle-fill mt-3"
				style="font-size: 2.5rem; color: #e5484d;"></i>
			<h4 class="mt-3 mb-2">Co loi xay ra</h4>
			<p class="text-muted-green mb-1" th:text="${errorMessage}">...</p>
			<p class="text-muted-green small" th:if="${statusCode != null}">
				Ma loi: <span th:text="${statusCode}">500</span>
			</p>

			<a th:href="@{/home}"
				class="btn-custom btn-custom-primary w-100 mt-3">Ve trang chu</a>
		</div>
	</div>

	<script th:src="@{/assets/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
