<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quen mat khau - SHOP</title>
<link rel="icon" type="image/png" th:href="@{/assets/images/favicon.ico}">
<link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/main.css}">
</head>

<body>
	<div class="login-wrapper">
		<div class="login-bg-shape login-bg-shape-1"></div>
		<div class="login-bg-shape login-bg-shape-2"></div>

		<div class="login-card">
			<a th:href="@{/home}" class="login-brand text-decoration-none"> <i
				class="bi bi-bag-heart-fill"></i> <span>SHOP</span>
			</a>

			<p class="login-subtitle">Nhap email de nhan OTP dat lai mat khau</p>

			<form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}"
				method="post" accept-charset="UTF-8">

				<div th:if="${#fields.hasGlobalErrors()}"
					class="alert-custom alert-custom-danger mb-3">
					<i class="bi bi-exclamation-triangle-fill alert-custom-icon"></i>
					<div class="alert-custom-content">
						<p th:each="e : ${#fields.globalErrors()}" th:text="${e}"
							class="mb-0"></p>
					</div>
				</div>

				<div class="login-form-group">
					<label for="email" class="login-form-label">Email</label>
					<div class="login-input-group">
						<i class="bi bi-envelope input-icon"></i> <input type="email"
							id="email" th:field="*{email}" class="login-input"
							placeholder="name@company.com" required>
					</div>
					<small class="error-text" th:errors="*{email}"></small>
				</div>

				<button type="submit" class="btn-login">
					<span>Gui OTP</span> <i class="bi bi-send"></i>
				</button>
			</form>

			<p class="login-footer-text">
				<a th:href="@{/login}">Quay lai Login</a>
			</p>
		</div>
	</div>

	<script th:src="@{/assets/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
