<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dat lai mat khau - SHOP</title>
<link rel="icon" type="image/png" th:href="@{/assets/images/favicon.ico}">
<link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/main.css}">
</head>

<body>
	<div class="login-wrapper">
		<div class="login-bg-shape login-bg-shape-1"></div>
		<div class="login-bg-shape login-bg-shape-2"></div>

		<div class="login-card">
			<a th:href="@{/home}" class="login-brand text-decoration-none"> <i
				class="bi bi-bag-heart-fill"></i> <span>SHOP</span>
			</a>

			<p class="login-subtitle">Nhap OTP va mat khau moi</p>

			<div th:if="${success}" class="alert-custom alert-custom-success mb-3">
				<i class="bi bi-check-circle-fill alert-custom-icon"></i>
				<div class="alert-custom-content" th:text="${success}">Da gui</div>
			</div>

			<form th:action="@{/reset-password}" th:object="${resetPasswordDTO}"
				method="post" accept-charset="UTF-8">

				<div th:if="${#fields.hasGlobalErrors()}"
					class="alert-custom alert-custom-danger mb-3">
					<i class="bi bi-exclamation-triangle-fill alert-custom-icon"></i>
					<div class="alert-custom-content">
						<p th:each="e : ${#fields.globalErrors()}" th:text="${e}"
							class="mb-0"></p>
					</div>
				</div>

				<div class="login-form-group">
					<label for="email" class="login-form-label">Email</label>
					<div class="login-input-group">
						<i class="bi bi-envelope input-icon"></i> <input type="email"
							id="email" th:field="*{email}" class="login-input" required>
					</div>
					<small class="error-text" th:errors="*{email}"></small>
				</div>

				<div class="login-form-group">
					<label for="otp" class="login-form-label">OTP</label>
					<div class="login-input-group">
						<i class="bi bi-key input-icon"></i> <input type="text" id="otp"
							name="otp" class="login-input" maxlength="6"
							inputmode="numeric" required>
					</div>
				</div>

				<div class="login-form-group">
					<label for="password" class="login-form-label">Mat khau moi</label>
					<div class="login-input-group">
						<i class="bi bi-shield-lock input-icon"></i> <input
							type="password" id="password" th:field="*{password}"
							class="login-input login-input-password" required>
					</div>
					<small class="error-text" th:errors="*{password}"></small>
				</div>

				<div class="login-form-group">
					<label for="confirmPassword" class="login-form-label">Xac
						nhan mat khau</label>
					<div class="login-input-group">
						<i class="bi bi-shield-lock input-icon"></i> <input
							type="password" id="confirmPassword"
							th:field="*{confirmPassword}"
							class="login-input login-input-password" required>
					</div>
					<small class="error-text" th:errors="*{confirmPassword}"></small>
				</div>

				<button type="submit" class="btn-login">
					<span>Doi mat khau</span> <i class="bi bi-check-lg"></i>
				</button>
			</form>

			<p class="login-footer-text">
				<a th:href="@{/login}">Quay lai Login</a>
			</p>
		</div>
	</div>

	<script th:src="@{/assets/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
