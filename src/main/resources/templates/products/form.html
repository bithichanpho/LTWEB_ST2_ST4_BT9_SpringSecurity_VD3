<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('San pham')}"></head>
<body>

	<div th:replace="~{layouts/layout :: page(~{::main})}">

		<main>

			<div class="card border-light shadow-sm p-4">
				<div class="d-flex align-items-center gap-3 mb-4"
					th:if="${mode == 'edit' and productDTO.displayImageUrl != null}">
					<img th:src="${productDTO.displayImageUrl}" alt=""
						style="width: 64px; height: 64px; object-fit: cover; border-radius: 12px;">
					<div>
						<h5 class="card-title mb-0">Sua san pham</h5>
						<div class="text-muted-green small">
							Ma san pham: <span th:text="${productDTO.id}">SP01</span> - Nguoi
							tao: <span th:text="${productDTO.username}">user</span>
						</div>
					</div>
				</div>
				<h5 class="card-title mb-4" th:if="${mode != 'edit'}">Thong
					tin san pham</h5>

				<form
					th:with="actionUrl=${mode == 'create' ? '/products/create' : '/products/edit/' + productDTO.id}"
					th:action="@{${actionUrl}}" th:object="${productDTO}" method="post"
					enctype="multipart/form-data" accept-charset="UTF-8">

					<div th:if="${#fields.hasGlobalErrors()}"
						class="alert-custom alert-custom-danger mb-3">
						<i class="bi bi-exclamation-triangle-fill alert-custom-icon"></i>
						<div class="alert-custom-content">
							<p th:each="e : ${#fields.globalErrors()}" th:text="${e}"
								class="mb-0"></p>
						</div>
					</div>

					<div class="row g-3">
						<div class="col-md-8">
							<label class="form-label-custom">Ten san pham</label> <input
								class="form-control-custom" th:field="*{name}"
								placeholder="Vd: Ao thun regular fit">
							<div class="error-text small" th:errors="*{name}"></div>
						</div>

						<div class="col-md-4">
							<label class="form-label-custom">Gia (VND)</label> <input
								type="number" step="1000" min="0" class="form-control-custom"
								th:field="*{price}" placeholder="0">
							<div class="error-text small" th:errors="*{price}"></div>
						</div>

						<div class="col-md-6">
							<label class="form-label-custom">Hinh anh san pham <span
								th:if="${mode == 'edit'}">(bo trong neu giu nguyen)</span></label> <input
								type="file" name="image" accept="image/*"
								class="form-control-custom">
						</div>

						<div class="col-12">
							<label class="form-label-custom">Mo ta</label>
							<textarea rows="4" class="form-control-custom"
								th:field="*{description}"
								placeholder="Mo ta chat lieu, kich thuoc, cach bao quan..."></textarea>
							<div class="error-text small" th:errors="*{description}"></div>
						</div>
					</div>

					<div class="d-flex gap-2 mt-4">
						<button type="submit" class="btn-custom btn-custom-primary">
							<i class="bi bi-check-lg"></i> Luu san pham
						</button>
						<a th:href="@{/products}"
							class="btn-custom btn-custom-outline-primary">Huy</a>
					</div>

					<p class="mt-3" th:if="${mode == 'create'}"
						style="padding: 12px; background: #fff7ed; border-radius: 7px;">
						Anh san pham se duoc upload len <b>Cloudinary</b> (neu cau hinh
						trong .env) hoac luu local (fallback khi chua cau hinh).
					</p>
				</form>
			</div>

		</main>

	</div>

</body>
</html>
